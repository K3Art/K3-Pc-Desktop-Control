<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Controls Launcher</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1a1a1e"/>
<style>
*{box-sizing:border-box;font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{margin:0;background:#0f0f12;color:#fff;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:#0f0f12cc;backdrop-filter:blur(12px);padding:14px 16px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0;letter-spacing:.3px}
.sub{color:#888;font-size:12px;margin-top:2px}
.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#222;color:#aaa}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#1a1a1f;border:1px solid #2a2a30;border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.card.toggle{border-color:#2a2a30}
.card.toggle.alive{border-color:#1a5c2a;background:#142214}
.card.toggle.dead{border-color:#5c1a1a;background:#221414}
.icon{font-size:28px;line-height:1}
.name{font-size:13px;font-weight:600;line-height:1.2;min-height:32px}
.desc{font-size:11px;color:#888;line-height:1.3;min-height:28px}
.status{font-size:11px;font-weight:700;letter-spacing:.5px}
.status.alive{color:#2ecc71}
.status.dead{color:#ff5a5a}
.status.unknown{color:#888}
.switch{position:relative;width:52px;height:30px;background:#333;border-radius:999px;cursor:pointer;transition:.2s;border:none;flex-shrink:0}
.switch.on{background:#2ecc71}
.knob{position:absolute;top:3px;left:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.switch.on .knob{transform:translateX(22px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.runBtn{width:100%;padding:10px;border:none;border-radius:10px;background:#2a5cff;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.runBtn:active{transform:scale(.97)}
.runBtn:disabled{opacity:.5}
.section{grid-column:1 / -1;color:#666;font-size:11px;letter-spacing:.8px;text-transform:uppercase;padding:6px 2px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;border:1px solid #333;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.subfolder{grid-column:1 / -1;background:#16161a;border:1px dashed #2a2a30;border-radius:12px;padding:10px 12px;margin-top:4px}
.subfolder b{font-size:12px;color:#aaa}
</style>
</head>
<body>
<header>
  <div>
    <h1>Controls <span style="color:#888;font-weight:400">— Desktop\Controls</span></h1>
    <div class="sub" id="sub">loading…</div>
  </div>
  <span class="badge" id="health">● checking</span>
</header>
<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
