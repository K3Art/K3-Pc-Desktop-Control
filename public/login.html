<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Sign in · K3 Controls</title><style>body{margin:0;background:#0a0a0b;color:#f1f1f1;font:16px system-ui;display:grid;place-items:center;min-height:100dvh}main{width:min(90%,400px)}h1{font-size:1.5rem}p{color:#ccc;line-height:1.5}label{display:block;margin:24px 0 8px}input[type=password],button{box-sizing:border-box;width:100%;padding:14px;font:inherit;border:1px solid #777;background:#19191b;color:#fff}button{margin-top:12px;background:#eee;color:#111;font-weight:600}#error{color:#ffb4b0}</style></head><body><main><h1>Sign in to K3 Controls</h1><p>First time? On your PC, open Desktop → Controls → Set Controls Password.cmd.</p><form id="login"><label for="password">Password</label><input id="password" type="password" required minlength="11" maxlength="256" autocomplete="current-password"><label><input id="remember" type="checkbox"> Remember this device for 30 days</label><button>Sign in</button><p id="error" role="alert"></p></form><p>Otherwise, sign-ins last up to eight hours. Changing the password signs out every device.</p></main><script src="/login.js" defer></script></body></html>
